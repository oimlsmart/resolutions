- identifier:
  - prefix: CIML
    number: 2001/4
  doi: 10.63493/resolutions/ciml200104
  urn: urn:oiml:doc:ciml:resolution:2001-04
  dates:
  - date: '2001-09-25'
    type: adoption
  localizations:
  - language_code: fra
    script: Latn
    title: Relations entre les RLMO
    subject: le Bureau
    actions:
    - type: remarks
      message: 'M. Birch souligne que, probablement en raison d''un manque de ressources,
        il y a un besoin pour les RLMO d''échanger entre elles des informations sur
        leurs programmes. De plus, il serait peut être approprié de définir le rôle
        des RLMO dans ce qu''il est distinct des rôles de l''OIML et du Conseil de
        Développement. Il est également nécessaire de faire en sorte que les doublements
        soient évités, par exemple dans le développement de cours de formation. Afin
        de mettre ces vues en application, l''APLMF a essayé d''échanger des informations
        avec les autres RLMO en les invitant à assister aux réunions Asie-Pacifique
        et en réagissant positivement aux invitations de ce genre en provenance des
        autres RLMO, et en leur fournissant des rapports sur les activités de l''APLMF.
        Une coopération similaire entre RLMO devrait exister dans le domaine des intercomparaisons
        en raison du coût de ces actions et du fait que les intercomparaisons devraient
        probablement être organisées au niveau régional. L''utilisation d''installations
        d''essai communes et en conséquence la possibilité d''y avoir accès devraient
        également être d''intérêt pour les RLMO. M. Birch conclut en soulignant le
        rôle des RLMO dans la mise en application des Recommandations OIML et dans
        l''établissement d''un système global de mesure. Les RLMO doivent en conséquence
        inter-réagir.

        '
      date_effective:
        date: '2001-09-25'
        type: adoption
  type: resolution
- identifier:
  - prefix: CIML
    number: 2001/5
  doi: 10.63493/resolutions/ciml200105
  urn: urn:oiml:doc:ciml:resolution:2001-05
  dates:
  - date: '2001-09-25'
    type: adoption
  localizations:
  - language_code: fra
    script: Latn
    title: Relations entre les RLMO et le Conseil de Développement
    subject: le Conseil
    actions:
    - type: remarks
      message: 'M. Birch dit qu''il serait nécessaire de définir les domaines de travail
        propres au Conseil de Développement d''une part, aux RLMO d''autre part, en
        particulier pour les questions de formation. Des réunions périodiques du Conseil
        de Développement et des RLMO seraient probablement appropriées pour identifier
        et éliminer les activités se recouvrant.

        '
      date_effective:
        date: '2001-09-25'
        type: adoption
  type: resolution
