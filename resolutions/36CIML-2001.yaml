  - language_code: eng
    script: Latn
    title: Future development in TC/SC working methods and use of modern communication
      means
    subject: The Bureau
    actions:
    - type: remarks
      message: 'Mr. Magaña said that the Bureau was developing a number of tools and
        activities connected with information technology and electronic means and
        would apply them as much as possible in OIML work. This would accelerate OIML
        technical work, facilitate the participation of all Members therein, facilitate
        the preparation of meetings (it being understood that electronic means will
        not supersede meetings) and save money by reducing paper consumption, telephone
        usage, etc.

        '
      date_effective:
        date: '2001-09-25'
        type: adoption
  - language_code: fra
    script: Latn
    title: Développements ultérieurs dans les méthodes de travail des TC/SC et utilisation
      de moyens de communi…
    subject: Le Comité
    actions:
    - type: remarks
      message: 'Le Comité a pris note d''informations fournies par le BIML concernant
        l''utilisation du courrier électronique et d''Internet dans le développement
        du travail technique de l''OIML et des remarques faites par certains Membres
        (communication utilisant soit le papier soit le courrier électronique; utilisation
        de CD-roms, harmonisation des équipements techniques permettant d''organiser
        des vidéo-conférences, etc.). Le Comité a demandé au Bureau de donner une
        première priorité à la révision des Directives pour les travaux techniques
        et a vivement conseillé à ses Membres de développer au niveau national des
        moyens de communication modernes, afin d''accélérer et de faciliter le travail
        technique de l''OIML tout en diminuant les coûts de fonctionnement.

        '
      date_effective:
        date: '2001-09-25'
        type: adoption
