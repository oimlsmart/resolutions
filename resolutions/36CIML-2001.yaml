      message: 'Le Comité a décidé de tenir sa 37ème réunion en France entre la fin
        du mois de septembre et le début du mois d''octobre 2002, organisée par le
        Bureau sous la supervision du Président du CIML et de son Conseil.

        '
      date_effective:
        date: '2001-09-25'
        type: adoption
  type: resolution
