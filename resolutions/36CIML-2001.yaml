    actions:
    - type: remarks
      message: 'L''atelier L''avenir de la Métrologie Légale en 2020 pour lequel un
        certain nombre d''interventions ont déjà été proposées, se tiendra pendant
        une journée et demi en liaison avec la 37ème réunion du CIML en France en
        septembre ou octobre 2002.

        '
      date_effective:
        date: '2001-09-25'
        type: adoption
