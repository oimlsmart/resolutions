  localizations:
  - language_code: eng
    script: Latn
    title: Plans for future developments (see also MAA below)
    subject: the Bureau
    actions:
    - type: remarks
      message: 'Mr. Kochsiek reminded the participants that the revision of the paper
        OIML Certificate System for Measuring Instruments had now reached a well advanced
        stage and would quite probably be approved and published in 2002. According
        to this paper the scope of the System would be enlarged in two directions:
        (i) the certification of types of modules and (ii) the certification of types
        of families (of instruments or of modules). These actions were also foreseen
        in the Action Plan and, if approved, would result in an increasing workload
        for a number of TCs/SCs with the development of additional test report formats
        for types of modules and types of families. In addition the revision of the
        operational rules of the System would create a shift in responsibilities from
        the CIML Members to the Issuing Authorities and also contained new provisions
        for the identification of the certified types.

        '
      date_effective:
        date: '2001-09-25'
        type: adoption
  - language_code: fra
    script: Latn
    title: Projets pour développement ultérieurs (voir aussi MAA ci-dessous)
    subject: Le Comité
    actions:
    - type: remarks
      message: 'Le Comité a pris note d''informations concernant la révision actuelle
        du document décrivant les règles de fonctionnement du Système et a conseillé
        vivement au TC 3/SC 5, sous la responsabilité commune des USA et du Bureau,
        de terminer cette révision d''urgence. Le Comité a noté que certaines questions
        très importantes, en particulier la certification des instruments individuels,
        n''étaient pas inclus dans cette révision; le Comité a donc demandé au TC
        3/SC 5 de commencer à travailler sur ces questions dès que possible et au
        plus tard lorsque l''actuelle révision sera terminée. Enfin le Comité a noté
        qu''un certain nombre d''aspects de fonctionnement du Système (par exemple
        le rôle des Membres du CIML) étaient étroitement liés aux modes de fonctionnement
        du futur MAA (voir point 10 ci-après) et a demandé au TC 3/SC 5 d''eliminer
        les éventuelles divergences entre les deux documents.

        '
      date_effective:
        date: '2001-09-25'
        type: adoption
  type: resolution
