- identifier:
  - prefix: CIML
    number: 2001/2
  doi: 10.63493/resolutions/ciml200102
  urn: urn:oiml:doc:ciml:resolution:2001-02
  agenda_item: '2'
  dates:
  - date: '2001-10-25'
    type: decided
  title:
  - spelling: eng
    value: Implementation of the decisions and resolutions of the Eleventh Conference
  actions:
  - type: notes
    date_effective:
      date: '2001-10-25'
      type: effective
    message:
    - spelling: eng
      value: Each RLMO was invited to make a brief presentation of its membership,
        current activities and trends for the future. These presentations are not
        reproduced in full in these minutes since updated information is permanently
        available from literature issued by these RLMOs and, for some of them, from
        their web sites. Only the main aspects are summarized below.
- identifier:
  - prefix: CIML
    number: 2001/3
  doi: 10.63493/resolutions/ciml200103
  urn: urn:oiml:doc:ciml:resolution:2001-03
  agenda_item: '3'
  dates:
  - date: '2001-10-25'
    type: decided
  title:
  - spelling: eng
    value: Reexamination of the 1999-2002 Action Plan and its extension to cover the
      period 2003-2004
  actions:
  - type: notes
    date_effective:
      date: '2001-10-25'
      type: effective
    message:
    - spelling: eng
      value: Mr. Magaña presented a list of topics, the discussion of which was suggested
        either by certain RLMOs or by the BIML.
- identifier:
  - prefix: CIML
    number: 2001/4
  doi: 10.63493/resolutions/ciml200104
  urn: urn:oiml:doc:ciml:resolution:2001-04
  agenda_item: '4'
  dates:
  - date: '2001-10-25'
    type: decided
  title:
  - spelling: eng
    value: Member States and Corresponding Members
  - spelling: fra
    value: Member States and Corresponding Members
  subject:
  - spelling: fra
    value: "(The CIML)"
  actions:
  - type: notes
    date_effective:
      date: '2001-10-25'
      type: effective
    message:
    - spelling: eng
      value: Mr. Birch pointed out that, probably because of a lack of resources,
        there was a need for RLMOs to be in communication with each other about their
        programs. In addition it would perhaps be appropriate to define the role of
        RLMOs as distinct from the OIML and Development Council roles. It would also
        be necessary to make sure that duplication is avoided e.g. in the development
        of training courses. In order to implement these views the APLMF had tried
        to share information with other RLMOs by inviting them to attend Asia-Pacific
        meetings and reacting positively to invitations of this kind from other RLMOs
        and providing them with reports concerning APLMF activities. Similar cooperation
        amongst RLMOs should exist in the field of intercomparisons owing to the cost
        of such actions and to the fact that intercomparisons should probably be carried
        out at regional level. The utilization of common test facilities, and therefore
        their accessibility, should also be of interest for RLMOs. Mr. Birch concluded
        by pointing out the role of RLMOs in the implementation of OIML Recommendations
        and in the establishment of a global measurement system. RLMOs therefore need
        to interact.
    - spelling: fra
      value: Le Comité a noté avec satisfaction que cet État Membre a payé non seulement
        ses cotisations pour 2000 et pour 2001, mais a également commencé à payer
        ses arriérés pour 1996-1999.
- identifier:
  - prefix: CIML
    number: 2001/5
  doi: 10.63493/resolutions/ciml200105
  urn: urn:oiml:doc:ciml:resolution:2001-05
  agenda_item: '5'
  dates:
  - date: '2001-10-25'
    type: decided
  title:
  - spelling: eng
    value: Financial matters
  - spelling: fra
    value: Financial matters
  subject:
  - spelling: fra
    value: "(The CIML)"
  actions:
  - type: notes
    date_effective:
      date: '2001-10-25'
      type: effective
    message:
    - spelling: eng
      value: Mr. Birch said that it would be necessary to define the appropriate areas
        to be taken on by the Development Council on the one hand and by RLMOs on
        the other hand, especially in connection with training. Regular meetings of
        the Development Council and RLMOs would probably be appropriate in order to
        identify and eliminate overlapping activities.
    - spelling: fra
      value: Le Comité a pris note d'informations fournies par le BIML concernant
        la situation financière de l'Organisation en 2001 et a considéré que cette
        situation était conforme aux décisions de la Onzième Conférence. Le Comité
        a également noté les informations fournies par le Bureau au sujet de l'année
        2002, notamment le passage à l'Euro, une nouvelle présentation des comptes
        du BIML qui permettrait de mieux estimer les coûts de fonctionnement des différents
        organes constituent l'OIML et les prix de revient des produits et des services
        fournis par le BIML, et la nouvelle politique du Bureau en matière de fixation
        des prix et de vente des publications.
