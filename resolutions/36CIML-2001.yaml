    title: Other matters
    subject: The Committee
    actions:
    - type: remarks
      message: 'Mr. Magaña gave information concerning the proposed lectures he had
        received for the workshop What will Legal Metrology be in the Year 2020. There
        was however not sufficient time to organize this workshop in February 2002
        as initially planned. He therefore proposed that the workshop should be held
        in September or October 2002 in conjunction with the 37th CIML Meeting. The
        Committee agreed with this proposal. Mr. Magaña added that there was still
        time to put forward additional lectures and that the Presidential Council
        would make the selection amongst all proposed lectures during its meeting
        in February 2002.

        '
      date_effective:
        date: '2001-09-25'
        type: adoption
  - language_code: fra
    script: Latn
