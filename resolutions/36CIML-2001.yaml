  - language_code: eng
    script: Latn
    title: Presidential Council activities
    actions:
    - type: remarks
      message: 'Mr. Faber reminded the participants (and especially recently appointed
        CIML Members) that the Presidential Council is not a formal part of the Organization
        since it is not provided for in the OIML Convention; however it is a very
        useful and effective body to prepare discussions at the CIML level, it being
        understood that the Presidential Council does not make any decisions by itself.
        In 2001, the Presidential Council met in February and then in September just
        prior to the 36th CIML Meeting in order to review the output of the Eleventh
        Conference and 35th CIML Meeting and to prepare the decisions which might
        be made during the 36th CIML Meeting. In fact the items discussed by the Presidential
        Council were very close to those to be discussed during this 36th CIML Meeting.

        '
      date_effective:
        date: '2001-09-25'
        type: adoption
