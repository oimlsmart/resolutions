- identifier:
  - prefix: CIML
    number: 2002/8.2
  doi: 10.63493/resolutions/ciml20028.2
  urn: urn:oiml:doc:ciml:resolution:2002-8.2
  dates:
  - date: '2002-10-01'
    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: Examination of the situation of certain TCs/SCs
    subject: The Committee
    actions:
    - type: remarks
      message: 'The Committee took note of information delivered by Vice-President
        Mr. Issaev and by the Bureau concerning OIML technical activities and, while
        expressing its satisfaction for the work accomplished, requested the OIML
        TCs and SCs to accelerate their work especially in the fields listed as high
        priority and priority projects.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
    - type: approves
      message: 'The Committee approved the following projects as proposed by:

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
    - type: requests
      message: 'The Committee requested TC4 and TC 3/SC1 to provide for a common inquiry
        to define which of them will undertake the new work project on Verification
        and inspection intervals of legally controlled measuring instruments proposed
        by TC4.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
    - type: remarks
      message: 'The Committee allocated the Secretariat of TC 5 (until now vacant)
        to Slovenia, which had volunteered to assume responsibility for this Technical
        Committee.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
    - type: remarks
      message: 'The Committee established a new Subcommittee TC 17/SC 8 Instruments
        for quality analysis of agricultural products, allocated the Secretariat to
        Australia, and approved its first work project on Measuring instruments used
        for protein determination in grain.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
    - type: instructs
      message: 'The Committee instructed the Bureau and TC 3 to accelerate the work
        on the revision of OIMLD 1 Law on metrology.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
  - language_code: fra
    script: Latn
    title: Examen de la situation de certains TC/SC
    subject: Le Comité
    actions:
    - type: remarks
      message: 'Le Comité a pris note d''informations fournies par son Vice-Président
        M. Issaev et par le Bureau au sujet des activités techniques de l''OIML et,
        tout en exprimant sa satisfaction pour le travail accompli, a demandé aux
        TC et SC de l''OIML d''accélérer leur travail en particulier dans les domaines
        indiqués comme projets de haute priorité et prioritaires.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
    - type: remarks
      message: 'Le Comité a approuvé les projets suivants tels que proposés par:

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
    - type: remarks
      message: 'Le Comité a demandé au TC 4 et au TC 3/SC 1 de procéder à une enquête
        commune visant à définir lequel d''entre eux serait chargé du nouveau projet
        de travail sur les Intervalles de vérification et d''inspection des instruments
        de mesure soumis au contrôle légal proposé par le TC 4.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
    - type: remarks
      message: 'Le Comité a attribué le Secrétariat du TC 5 (encore vacant) à la Slovénie,
        qui s''est déclarée volontaire pour assumer la responsabilité de ce Comité
        Technique.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
    - type: remarks
      message: 'Le Comité a créé un nouveau Sous-comité Technique TC 17/SC 8 Instruments
        pour l''analyse qualitative des produits agricoles, en a attribué le Secrétariat
        à l''Australie, et a approuvé son premier projet de travail sur les Instruments
        de mesure utilisés pour la détermination des protéines dans les grains.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
    - type: remarks
      message: 'Le Comité a chargé le Bureau et le TC 3 d''accélérer le travail sur
        la révision de OIML D 1 Loi de métrologie.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
  type: resolution
- identifier:
  - prefix: CIML
