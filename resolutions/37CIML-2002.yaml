    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: Report on the Development Council
    subject: The Committee
    actions:
    - type: remarks
      message: 'The Committee congratulated Mrs. Annabi on her re-election as Development
        Council Chairperson and took note of a report delivered by her concerning
        Development Council activities

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
    - type: instructs
      message: 'The Committee instructed the President and the Bureau to take into
        consideration the proposals made by the Task Group in establishing a detailed
        work program which would be integrated into the OIML Action Plan.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
    - type: requests
      message: 'The Committee requested the Task Group to develop proposals for a
        new Development Council structure which may be approved by the $ 1 2^{th}
        $ Conference.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
  - language_code: fra
    script: Latn
    title: Rapport sur le Conseil de Développement
    subject: Le Comité
    actions:
    - type: remarks
      message: 'Le Comité a félicité Mme Annabi pour sa réélection en tant Présidente
        du Conseil de Développement et a pris note d''un rapport qu''elle a communiqué
        concernant les activités du

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
    - type: remarks
      message: 'Le Comité a chargé le Président et le Bureau de prendre en compte
        les propositions faites par le Groupe de Travail pour établir un programme
        de travail détaillé qui serait intégré au Plan d''Action OIML.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
    - type: remarks
      message: 'Le Comité a demandé au Groupe de Travail de développer des propositions
        pour une nouvelle structure du Conseil de Développement qui puisse être approuvée
        par la 12ème Conférence.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
  type: resolution
