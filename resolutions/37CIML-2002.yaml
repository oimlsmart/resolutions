    title: Activities of the Development Council, action plan and possible evolutions
      of its structures
    subject: the Conference
    actions:
    - type: remarks
      message: 'Mr. Faber reported that following the last Development Council meeting
        in Moscow, he had decided to establish a small "Task Group" for developing
        country matters, with a double mission: to speed up the work and to make it
        more transparent, and secondly to examine the structure of the Development
        Council and to make proposals for restructuring it to the Conference in 2004.
        He then asked Mrs. Annabi to give a report on the Development Council meeting
        which had taken place on 1 October 2002.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
  - language_code: fra
    script: Latn
    title: Activités du Conseil de Développement, plan d'action et évolutions possibles
      de ses structures
    subject: la Conférence
    actions:
    - type: remarks
      message: 'M. Faber a rapporté que suite à la dernière Réunion du Conseil de
        Développement à Moscou, il avait décidé de créer un petit "Groupe de Travail"
        pour les questions liées aux pays en développement, avec une mission double:
        accélérer le travail et le rendre plus transparent, et deuxième examiner la
        structure du Conseil de Développement et faire des propositions pour le restructurer
        lors de la Conférence en 2004. Il a ensuite demandé à Mme. Annabi de présenter
        un rapport sur la Réunion du Conseil de Développement qui avait eu lieu le
        1er Octobre 2002.

        '
      date_effective:
        date: '2002-10-01'
        type: adoption
