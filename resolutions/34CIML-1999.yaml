    title: CIML Presidency
    subject: The Committee
    actions:
    - type: remarks
      message: 'The Committee expressed the view that there would be no problem for
        Mr. Faber to be reelected at the next CIML Meeting but considered that it
        was appropriate to allow some time for possible candidates to make themselves
        known in writing to Vice-President Chappell before June 2000.

        '
      date_effective:
        date: '1999-10-06'
        type: adoption
  - language_code: fra
    script: Latn
    title: Présidence du CIML
    subject: Le Comité
    actions:
    - type: remarks
      message: 'Le Comité a exprimé l''opinion qu''il n''y aurait pas de problème
        pour que M. Faber soit réélu à la prochaine réunion du Comité mais a considéré
        qu''il était approprié de laisser un certain temps pour que des éventuels
        candidats se fassent connaître en écrivant au Vice-Président Chappell avant
        juin 2000.

        '
      date_effective:
        date: '1999-10-06'
        type: adoption
  type: resolution
