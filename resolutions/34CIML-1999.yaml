  - language_code: eng
    script: Latn
    title: Activities linked with mutual recognition of test results, accreditation,
      etc.
    subject: The Committee
    actions:
    - type: remarks
      message: 'The Committee took note of a report delivered by Vice-President Chappell
        concerning the OIML activities connected with conformity assessment and multi-lateral
        recognition of OIML pattern approvals, which will now be developed within
        a new subcommittee TC 3/SC 5 under the joint responsibility of the USA and
        the BIML. Dr. Chappell''s report also covered activities connected with prepackaged
        products (revision of R 87) and the possible establishment of an OIML mark
        for packagers.

        '
      date_effective:
        date: '1999-10-06'
        type: adoption
  - language_code: fra
    script: Latn
    title: Activités liées à la reconnaissance mutuelle des résultats d'essais, à
      l'accréditation, etc.
    subject: Le Comité
    actions:
    - type: remarks
      message: 'Le Comité a pris note d''un rapport donné par le Vice-Président Chappell
        relatif aux activités de l''OIML liées à l''évaluation de conformité et aux
        reconnaissances multilatérales d''approbations de modèle OIML, qui seront
        désormais développées au sein d''un nouveau sous-comité TC 3/SC 5 sous la
        responsabilité conjointe des USA et du BIML. Le rapport du Dr. Chappell a
        également couvert les activités liées aux produits préemballés (révision de
        la R 87) et l''éventuelle création d''une marque OIML pour les emballeurs.

        '
      date_effective:
        date: '1999-10-06'
        type: adoption
  type: resolution
