    title: World Trade Organization (WTO)
    subject: The Committee
    actions:
    - type: remarks
      message: 'The Committee took note with extreme interest of a presentation on
        the WTO/TBT Committee made by Mrs. Liu, Economic Officer at the WTO, which
        focused on WTO activities connected with the development and application of
        international standards, bi-lateral recognition agreements, accreditation
        and certification procedures, etc. and their possible impact on technical
        barriers to trade.

        '
      date_effective:
        date: '1999-10-06'
        type: adoption
  - language_code: fra
    script: Latn
    title: Organisation Mondiale du Commerce (OMC)
    subject: Le Comité
    actions:
    - type: remarks
      message: 'Le Comité a pris note avec un intérêt extrême de la présentation du
        Comité des barrières techniques au commerce de l''OMC faite par Mme Liu, Economic
        Officer à l''OMC, présentation qui s''est concentrée sur les activités de
        l''OMC liées au développement et à l''application des normes internationales,
        aux accords bilatéraux de reconnaissance, aux procédures d''accréditation
        et de certification, etc. et sur leurs éventuels impacts sur les barrières
        techniques au commerce.

        '
      date_effective:
        date: '1999-10-06'
        type: adoption
  type: resolution
