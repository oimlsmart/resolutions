    title: Regional Legal Metrology Organizations (RLMO's)
    subject: The Committee
    actions:
    - type: remarks
      message: 'The Committee took note of information given by Representatives of
        the various Regional Legal Metrology Organizations present at the meeting.
        The Committee also took note of information from Mr. Magana concerning an
        emerging cooperation in legal metrology in the Euro-Mediterranean region,
        and of the request from this cooperation to have OIML D1 Law on Metrology
        and papers on equipment revised and reissued as quickly as possible.

        '
      date_effective:
        date: '1999-10-06'
        type: adoption
  - language_code: fra
    script: Latn
    title: Organisations régionales de métrologie légale
    subject: Le Comité
    actions:
    - type: remarks
      message: 'Le Comité a pris note d''informations données par les Représentants
        des différentes Organisations régionales de métrologie légale presents à la
        réunion. Le Comité a aussi pris note d''informations données par M. Magana
        au sujet d''une coopération naissante en matière de métrologie légale dans
        la région Euro-Mediterranéenne, et de la demande, par cette coopération, de
        voir le Document OIML D 1 (Loi de métrologie) et les documents sur l''équipement
        révisés et republiés aussi rapidement que possible.

        '
      date_effective:
        date: '1999-10-06'
        type: adoption
