  localizations:
  - language_code: eng
    script: Latn
    title: 'Regional organizations having activities connected with legal metrology
      (in particular: European Com…'
    subject: The Committee
    actions:
    - type: remarks
      message: 'The Committee took note of information given by the Bureau and by
        Dr. Bennett, on behalf of both the United Kingdom and WELMEC, concerning the
        development of a European Directive on measuring instruments (MID) and the
        associated development of OIML Normative Documents which would give a presumption
        of conformity with the MID metrological requirements. The Committee also took
        note of remarks from Vice-President Chappell concerning the necessity to clearly
        inform all OIML Members about these developments and to act in such a way
        that the creation of regional technical barriers to trade will be avoided.

        '
      date_effective:
        date: '1999-10-06'
        type: adoption
    - type: remarks
      message: 'The Committee was informed that a meeting between the BIML Director
        and the Secretary General of CEN and that of CENELEC was expected to be held
        soon.

        '
      date_effective:
        date: '1999-10-06'
        type: adoption
  - language_code: fra
    script: Latn
    title: 'Organisations régionales ayant des activités liées à la métrologie légale
      (en particulier: Commissio…'
    subject: Le Comité
    actions:
    - type: remarks
      message: 'Le Comité a pris note d''informations données par le Bureau et par
        Dr. Bennett, au nom à la fois du Royaume-Uni et de WELMEC, en ce qui concerne
        l''élaboration d''une Directive Européenne sur les instruments de mesure (MID)
        et le développement associé de Documents Normatifs OIML qui donneraient une
        présomption de conformité aux exigences métrologiques de la Directive. Le
        Comité a aussi pris note de remarques du Vice-Président Chappell au sujet
        de la nécessité d''informer clairement tous les Membres de l''OIML sur ces
        développements et d''agir de telle manière que la création de barrières techniques
        régionales au commerce soit évitée.

        '
      date_effective:
        date: '1999-10-06'
        type: adoption
    - type: remarks
      message: 'Le Comité a été informé qu''une réunion entre le Directeur du BIML
        et le Secrétaire Général du CEN et celui du CENELEC devrait se tenir prochainement.

        '
      date_effective:
        date: '1999-10-06'
        type: adoption
  type: resolution
