        la Onzième Conférence une Table Ronde d''une demi-journée sur un sujet qui
        sera choisi par le Conseil de la Présidence en fonction des propositions que
        des Membres du CIML auront envoyées au Bureau avant fin 1999; le Conseil de
        la Présidence examinera avec Dr. Bennett la possibilité que cette Table Ronde
        ait un caractère ouvert.

        '
