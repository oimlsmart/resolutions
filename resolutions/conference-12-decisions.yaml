    subject: The Committee
    actions:
    - type: approves
      message: 'The Committee approved the Auditor''s report for 2002 and 2003 and
        requested its Acting President and the BIML Director to submit it to the Conference.

        '
      date_effective:
        date: '2004-10-26'
        type: adoption
    - type: remarks
      message: 'Le Comité a pris note de l''allocution d''ouverture prononcée par
        son Président Intérimaire.

        '
      date_effective:
        date: '2004-10-26'
        type: adoption
    - type: remarks
      message: 'Le Comité a approuvé sans modification le projet d''ordre du jour.

        '
      date_effective:
