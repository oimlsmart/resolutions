    title: Situation of certain Members
    subject: The Committee
    actions:
    - type: remarks
      message: 'The Committee noted that Zambia had been struck off the list of Member
        States, following the decisions made at the 38th CIML Meeting.

        '
      date_effective:
        date: '2004-10-26'
        type: adoption
    - type: remarks
      message: 'The Committee noted that a number of countries were in the process
        of, or were envisaging joining the Organization as Member States or as Corresponding
        Members.

        '
      date_effective:
        date: '2004-10-26'
        type: adoption
  - language_code: fra
    script: Latn
    title: Nouveaux Membres - Perspectives d'adhésions
    subject: La Conférence
    actions:
    - type: remarks
      message: 'La Conférence a constaté que le nombre de Membres de l''OIML avait
        significativement augmenté depuis la Onzième Conférence, malgré le fait que
        plusieurs Membres Correspondants avaient été radiés pour non paiement de leur
        contribution pendant plus de trois ans. La Conférence a pris note du fait
        que certains Membres Correspondants envisageaient d''adhérer en tant qu''États
        Membres et que plusieurs pays/économies comptaient adhérer en tant que Membres
        Correspondants.

        '
      date_effective:
        date: '2004-10-26'
        type: adoption
  type: decision
