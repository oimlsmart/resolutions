    title: POLITIQUE A LONG TERME
    subject: CIML
    actions:
    - type: remarks
      message: 'M. BIRKELAND rappelle que depuis plus de quatre années de nombreuses
        réflexions ont été consacrées à ce sujet. L''OIML est dans une situation de
        développement dynamiques pour répondre aux évolutions du monde et à celles
        de la métrologie. En application d''une décision antérieure du Comité, le
        Conseil de la Présidence s''est saisi de cette question et a établi un groupe
        ad-hoc comprenant le Président et les deux Vice-Présidents du CIML; ce groupe
        s''est réuni en juin 1993 au BIML puis un texte très préliminaire a été préparé
        par le Bureau. MM. CHAPPELL et KOCHSIEK ont indiqué qu''ils considéraient
        utile de préparer deux textes:

        '
      date_effective:
        date: '1993-10-04'
        type: adoption
