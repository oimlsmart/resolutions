    title: Établissement des sous-comités et attribution de la responsabilité de leurs
      secrétariats
    subject: CIML
    actions:
    - type: remarks
      message: 'M. VICHENKOV indique qu''en ce qui concerne les sous-comités, un certain
        nombre de TC ont décidé de ne pas en établir; d''autres ont d''ores et déjà
        établi leurs sous-comités dont les secrétariats ont été attribués et la participation
        (membres-P et -O) établie; pour quelques autres comités techniques, la procédure
        d''établissement des structures est toujours en cours.

        '
