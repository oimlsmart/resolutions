    title: BULLETIN OIML
    subject: CIML
    actions:
    - type: remarks
      message: 'Mlle FRENCH présente le nouveau Bulletin OIML dont le premier numéro,
        octobre décembre 1993, vient juste d''être publié. Elle replace la rénovation
        du Bulletin dans le cadre plus vaste d''une réflexion sur la politique de
        communication interne et externe du BIML, qu''elle a menée depuis environ
        un an, et qui l''a conduite à présenter aux Membres du CIML un rapport qui
        a reçu leur approbation.

        '
      date_effective:
        date: '1993-10-04'
        type: adoption
