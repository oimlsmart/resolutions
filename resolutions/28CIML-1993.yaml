    title: Rapport sur l'établissement des comités techniques
    subject: CIML
    actions:
    - type: remarks
      message: 'M. VICHENKOV rappelle les actions du Bureau pour la mise en place
        des nouvelles structures par comités techniques et sous-comités. Les 18 comités
        techniques ont vu la responsabilité de leur secrétariat attribuée et les listes
        des membres-P et -O établies. En ce qui concerne les programmes de travail
        (listes des thèmes à développer) ceux-ci ont déjà été acceptés par le Comité.

        '
      date_effective:
        date: '1993-10-04'
        type: adoption
  type: resolution
