    script: Latn
    title: BROCHURE OIML
    subject: CIML
    actions:
    - type: remarks
      message: 'Mlle FRENCH dit que, dans le cadre de la nouvelle politique de communication
        de l''Organisation, la création d''une nouvelle brochure d''information générale
        est apparue nécessaire. Elle prévoit de présenter les premières propositions
        au Conseil de la Présidence lors de sa réunion de 1994. Elle souligne cependant
        que les progrès sur la réalisation de cette brochure sont très liés à ceux
        sur la définition de la politique à long terme de l''Organisation.

        '
