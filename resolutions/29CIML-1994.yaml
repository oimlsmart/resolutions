    title: INFORMATISATION DU TRAVAIL DU BIML
    actions:
    - type: remarks
      message: 'M. Weber fait un rapport décrivant la situation actuelle du travail
        informatisé au BIML et sur les développements attendus dans un avenir proche.
        L''informatique s''applique déjà à certaines tâches administratives (calcul
        des salaires, listes d''adresses des abonnés du Bulletin) et il est prévu
        qu''elle s''applique bientôt à toutes les tâches de comptabilité. En ce qui
        concerne le travail technique, tous les projets de Recommandations et de Documents
        sont préparés sur ordinateur au plus tard au moment de la soumission aux Membres
        du CIML par correspondance; il est précisé que les projets approuvés au niveau
        des TCs ou des SCs sont de plus en plus envoyés sur disquette par les secrétariats
        au BIML, ce qui diminue ainsi les tâches de secrétariat du BIML. Toutes les
        publications, y compris le Bulletin, sont actuellement faites directement
        à partir de disquettes utilisées par l''imprimeur et les versions finales
        des textes des Recommandations et Documents récemment publiés sont donc disponibles
        sur papier et sur disquette. En ce qui concerne les certificats OIML, une
        base de données est déve-

        '
      date_effective:
        date: '1994-10-12'
        type: adoption
  type: resolution
