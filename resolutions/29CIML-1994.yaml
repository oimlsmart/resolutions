  dates:
  - date: '1994-10-12'
    type: adoption
  localizations:
  - language_code: fra
    script: Latn
    title: AUTRES QUESTIONS
    subject: Le Comité
    actions:
    - type: remarks
      message: 'Le Comité a pris note d''une information donnée par M. Kusakin, Membre
        du CIML pour la République de Bélarus, concernant les activités métrologiques
        de ce nouvel État Membre de l''OIML.

        '
      date_effective:
        date: '1994-10-12'
        type: adoption
    - type: remarks
      message: 'Le Comité a également pris note d''une proposition de la délégation
        du Brésil visant à demander aux Membres du CIML qui souhaitent inviter une
        réunion du CIML ou de la Conférence de l''OIML, d''en informer les autres
        Membres par écrit au moins deux mois avant que la décision ne soit prise,
        et a approuvé cette proposition.

        '
      date_effective:
        date: '1994-10-12'
        type: adoption
  type: resolution
