    - type: remarks
      message: "## Examination of the situation of certain TC's/SC's, if appropriate\n"
      date_effective:
        date: '2000-10-09'
        type: adoption
  - language_code: fra
    script: Latn
    title: Activités techniques
    subject: Le Comité
    actions:
    - type: remarks
      message: 'Le Comité a pris note d''un rapport du BIML décrivant la situation
        de certains Comités Techniques et Sous-Comités. Le Comité a noté qu''il n''y
        avait pas de nécessité que le secrétariat du TC 5 soit attribué à un État
        Membre mais qu''au contraire le TC 13 ne devrait pas rester sans secrétariat.
        Le Comité a aussi accepté que sous TC 16/SC 1 les activités sur les Instruments
        de mesure des gaz d''échappement des véhicules soient poursuivies par les
        Pays-Bas alors que les trois autres thèmes de travail seront de la responsabilité
        de la Fédération de Russie. Enfin, le Comité a noté que la Fédération de Russie
        pourrait être intéressée par le TC 8/SC 2 à condition que le travail se limite
        à l''élaboration du format de rapport d''essai pour la R 125.

        '
      date_effective:
        date: '2000-10-09'
        type: adoption
  type: resolution
