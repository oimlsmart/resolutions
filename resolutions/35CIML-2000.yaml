    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: BIML activities
    actions:
    - type: remarks
      message: 'Mr. Athané made some remarks concerning a written report on BIML activities
        since the last CIML Meeting, which had been distributed to all Participants.
        He pointed out that this report showed a significant increase in certain BIML
        activities connected, for example, with participating in OIML technical work,
        representing the OIML in meetings of other international and regional bodies,
        acting as secretariat of the Development Council, issuing publications and
        developing communication means, etc. As a conclusion, Mr. Athané said that
        he was convinced that the future BIML Director, with the assistance of the
        current BIML Staff, will be able to pursue its progression and development
        in terms of quality and quantity of BIML work. It was also said that the report
        on BIML activities would be published in an appropriate format in the next
        issue of the OIML Bulletin.

        '
      date_effective:
        date: '2000-10-09'
        type: adoption
