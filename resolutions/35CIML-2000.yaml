    title: Presidential Council activities
    subject: the Conference
    actions:
    - type: remarks
      message: 'Mr. Faber informed the Participants that the Presidential Council
        met twice in 2000, at the BIML in February as usual, and then in London on
        Sunday 8 October for a brief informal meeting. Mr. Faber explained that the
        Presidential Council was not provided for in the OIML Convention but had proved
        its usefulness over the years. Its two main responsibilities are to advise
        the President and to prepare and implement the decisions made by the CIML
        or by the Conference concerning budgetary and long term policy decisions.
        Therefore, the meeting held in Paris in February 2000 mainly focused on the
        financial situation of the OIML and preparation of the 2001-2004 budget, and
        a thorough examination of the Action Plan. In addition, the Presidential Council
        examined the preparations for the Round Table on Mutual Recognition and the
        BIPM/ILAC/OIML meeting which followed the Council meeting.

        '
      date_effective:
        date: '2000-10-09'
        type: adoption
