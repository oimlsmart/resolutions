    title: LONG-TERM POLICY OF THE ORGANIZATION
    subject: The Committee
    actions:
    - type: remarks
      message: 'Mr BIRKELAND remarked that there was no paper for that item of the
        agenda, and that the Committee was invited to discuss it orally. Obviously
        the two subjects, certification and the revision of the working method, were
        part of the Organization''s longterm policy and were even its main elements.
        However, there were other aspects of long-term policy that the Committee could
        discuss, and all present were invited to make known their thoughts on the
