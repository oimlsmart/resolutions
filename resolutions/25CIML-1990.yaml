        a draft on this subject to all Members in August 1990 with a request that
        comments be sent to the Bureau before 1990.12.31. He did not propose therefore
        that the draft be discussed at the meeting. The comments would be compiled
        by the Bureau and submitted to the Presidential Council at its next meeting.
        A final draft could then be sent to all the Members of the Committee for approval
        by correspondence or at the next meeting.

