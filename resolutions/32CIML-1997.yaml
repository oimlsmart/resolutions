    script: Latn
    title: Examination of the situation of certain TCs/SCs
    subject: The Committee
    actions:
    - type: remarks
      message: 'Mr. Chappell presented a report concerning the OIML technical activity
        carried out by the various TCs/SCs. It was noted that a decrease in this activity
        had occurred and the reasons for such a trend should be identified. One reason
        could be that the developments in the OIML Certificate System have necessitated
        significant efforts for reviewing and supplementing a number of Recommendations,
        thus delaying progress in other technical fields. In addition to this general
        report, a specific matter had to be considered by the Committee: Recommendation
        R 46 on electricity meters was rather old and conflicted with the corresponding
        IEC and CENELEC Standards; therefore, with the agreement of the secretariat
        of the relevant TC (Germany), it was requested that this Recommendation should
        be withdrawn from the list of available publications and that a revision should
        be rapidly initiated. The Committee agreed to this proposal.

        '
      date_effective:
        date: '1997-10-29'
        type: adoption
  type: resolution
