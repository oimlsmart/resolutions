    script: Latn
    title: Other liaisons (see also Item 10.2)
    actions:
    - type: remarks
      message: 'Mr. Kochsiek reported on a meeting of representatives of the OIML
        and of the Sistema Interamericano de Metrologia (SIM) held at the beginning
        of the week at INMETRO. The basis of a cooperation between the OIML and SIM
        had been discussed, mainly in the fields of training, documentation, equipment,
        traceability for weights and measures officers, dissemination of OIML publications,
        use of Internet, etc., plus the possibility for the OIML to stimulate the
        SIM Executive Secretariat, i.e. the Organization of American States, to financially
        support legal metrology activities in small countries in the region, including
        their participation in the OIML as Corresponding Members. OIML representatives
        had indicated that it was the general OIML policy to favor regional cooperation
        and to cooperate with regional metrology bodies, bearing in mind the fact
        that such cooperation should not be exclusive and should not prevent the OIML
        from cooperating with other bodies in the region. As a conclusion to these
        discussions, it was found appropriate to prepare a cooperation agreement which
        could be signed by both organizations on the occasion of this CIML meeting.

        '
      date_effective:
        date: '1997-10-29'
        type: adoption
  type: resolution
