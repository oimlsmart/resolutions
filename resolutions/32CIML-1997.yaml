    script: Latn
    title: Appointment of an Assistant Director
    subject: the Committee
    actions:
    - type: remarks
      message: 'Mr. Faber pointed out how important it was for the OIML to appoint
        a good Assistant Director, owing to the workload on the Bureau and to the
        very limited number of staff. In this connection, he had decided that the
        candidacies for the position of Assistant Director would be thoroughly examined
        by a selection committee comprising himself, Mr. Kochsiek and Mr. Athané.
        Five candidacies had been received: one was well known by the members of the
        selection committee and there had been no need to interview this person, whereas
        the four others had been individually interviewed. From these examinations
        and interviews, it resulted that two candidates (Ms. Nathalie Dupuis-Désormeaux,
        Canada, and Mr. Ian Dunmill, United Kingdom) were of excellent value, with
        perhaps different individual qualities but both capable of fulfilling the
        proposed responsibilities. The selection committee had therefore considered
        that it was not possible to select one or the other on purely objective grounds.

        '
      date_effective:
        date: '1997-10-29'
        type: adoption
  type: resolution
