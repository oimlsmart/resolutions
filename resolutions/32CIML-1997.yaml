    script: Latn
    title: REPORT ON BIML ACTIVITIES
    subject: the Bureau
    actions:
    - type: remarks
      message: 'Mr. Athanedistributed a written report summarizing the activities
        of the Bureau since the last CIML meeting. He pointed out that this annual
        report was significantly longer than the reports prepared for previous CIML
        meetings, due to a real increase in BIML work with new developments, increased
        participation in the activities of other international and regional institutions,
        acceleration in the issuing of Conference and Committee minutes, improvement
        in the issuing of OIML publications (including the Bulletin) with a systematic
        review of the Recommendations or articles to be issued by the secretariats
        concerned or by the authors, 100 % DTP production of the publications by the
        Bureau (resulting in a modest decrease in costs), development of the OIML
        page on Internet (see Item 13.2), etc.

        '
      date_effective:
        date: '1997-10-29'
        type: adoption
