  - language_code: eng
    script: Latn
    title: OIML on Internet (general information, meetings and proceedings, OIML certificates,
      OIML publication…
    subject: the Bureau
    actions:
    - type: remarks
      message: 'Mr. Athané summarized the development of the OIML page on Internet
        (information on legal metrology and OIML, addresses of OIML Members, lists
        of publications and certificates, links with the Internet pages of other international
        and regional bodies, etc.) and indicated in which direction the Bureau was
        trying to further improve and develop the information contained therein, particularly
        with respect to the availability of OIML publications. This was creating two
        kinds of problems: a technical problem, i.e. the possibility of correctly
        retrieving a publication containing text, mathematical formulae, tables and
        illustrations without occupying too much memory, and a financial one, linked
        with the fact that OIML publications should be available free of charge for
        OIML Members'' official bodies and against payment for others. However, it
        should also be examined whether the present OIML policy concerning the availability
        of publications free of charge or against payment according to the interested
        body should not be reconsidered, e.g. by deciding that all OIML publications
        will be freely available to everybody through Internet, without the need for
        printed versions (it was reminded that printing is expensive and that this
        cost is not counter-balanced by the income from sales of publications, even
        if these sales are continuously increasing).

        '
      date_effective:
