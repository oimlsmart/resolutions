    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: Revision of the paper governing the operation of the System
    subject: the Bureau
    actions:
    - type: remarks
      message: 'Mr. Athané reminded the participants of the activity of the Technical
        Advisory Group on Certification （TAG $ ^{\mathrm{cert}} $ ). He explained
        that due to the Bureau''s workload, the paper governing the operational rules
        of the System had not yet been revised; in fact, it was his opinion that the
        revision of this paper was not of the highest priority and that it was necessary
        to first well establish the System as it was, make it known to manufacturers
        and users of measuring instruments, favor the acceptance of OIML certificates
        and test results by the national legal metrology services of OIML Members,
        etc. Thereafter, improvements and amendments in the operational process could
        be decided and implemented.

        '
      date_effective:
        date: '1997-10-29'
        type: adoption
  type: resolution
