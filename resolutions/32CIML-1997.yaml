    title: Planning of an international Seminar to be held in Germany in cooperation
      with the BIPM, IMEKO and P…
    subject: the Committee
    actions:
    - type: remarks
      message: 'Mr. Kochsiek reminded the participants of the background to this Seminar,
        the idea of which dates back to three years ago in Turin during an IMEKO TC
        11 workshop. Mr. Kochsiek, as OIML Representative and Mr. Quinn, Director
        of the BIPM, had agreed that a joint action with IMEKO TC 11 with a view to
        assisting developing countries and countries in transition towards a market
        economy in the establishment of sound national metrological infrastructures
