    script: Latn
    title: General information regarding the operation of the System
    subject: the Bureau
    actions:
    - type: remarks
      message: 'Mr. Athané summarized the information distributed in written form
        concerning the developments of this activity: more than 300 certificates have
        been issued since the establishment of the System, for some six categories
        of measuring instruments, although it should be noted that most of the certificates
        were issued for nonautomatic weighing instruments and for load cells. This
        fact should be considered when discussing the future of the System: is it
        useful to have the System theoretically applying to a large number of categories
        of measuring instruments, whereas only manufacturers of a few of these categories
        apply for certificates. An informative action aimed at drawing the attention
        of manufacturers to the benefits they could gain from applying for OIML certificates
        should be carried out by both the Bureau and CIML Members.

        '
      date_effective:
        date: '1997-10-29'
        type: adoption
  type: resolution
