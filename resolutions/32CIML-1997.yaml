    title: BIPM/OIML rapprochement and liaisons with ILAC
    actions:
    - type: remarks
      message: 'Mr. Faber said that there was not too much to report after the extensive
        reports and discussions which took place in Beijing in 1995 and in Vancouver
        in 1996, since the situation had practically not evolved over the last twelve
        months. In application of the Resolution adopted by the Tenth Conference,
        he had led an OIML delegation which had attended a joint Convention du Mette/OIML
        meeting at the BIPM. In addition to the representatives of the two organizations,
        Messrs. Gilmour and Karls had attended the last part of the meeting as ILAC
        representatives. The discussions on cooperation had mainly focused on the
        matter of developing countries, which will be discussed in more depth under
        Item 10 of the agenda. Mr. Faber had also taken this opportunity to introduce
        the Birkeland study and try to establish some preliminary links with the Blevin
        study which was being conducted within the CIPM. He said that the reactions

        '
      date_effective:
        date: '1997-10-29'
        type: adoption
  type: resolution
