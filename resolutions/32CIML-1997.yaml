        BIML, Mr. Seiler, Chairman of IMEKO TC 11 and the President of the Physikalisch-Technische
        Bundesanstalt had signed a letter of intent to organize such a Seminar, with
        a view to informing decision makers and high level political persons in developing
        and transition countries of the Role of metrology in eco-

