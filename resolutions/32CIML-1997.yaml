  dates:
  - date: '1997-10-29'
    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: Cooperation within the recently established JCGM (Joint Committee for Guides
      on Metrology), successo…
    actions:
    - type: remarks
      message: 'Mr. Athané reminded the participants of the history of the establishment
        of this Joint Committee, to replace the former cooperation within the ISO/TAG
        4. He also said that, because of a misunderstanding with the person concerned
        within the ISO Central Secretariat, official approval of the JCGM Charter
        by the CIML had not yet been carried out although a meeting of this Joint
        Committee had already been called (to take place at the BIML in November 1997).
        Therefore, it was suggested that the CIML accept this Charter. Mr. Athané
        pointed out that both the name of this Joint Committee (which had initially
        been envisaged as a Forum for Inter-institutional Cooperation in Metrology,
        FICOM) and its scope had been carefully reviewed in order to make clear that
        (i) this was in no way a new additional international organization but a Joint
        Committee created by existing bodies, and that (ii) its responsibilities would
        be limited to the development of guides on metrology of interest for the member
        organizations. He also added that the BIPM and the BIML would propose to jointly
        hold the secretariat of the JCGM owing to the current workload on the ISO
        Central Secretariat (Dr. Quinn, Director of the BIPM, would act as Chairman
        of the JCGM for the period 1997-2000).

        '
      date_effective:
        date: '1997-10-29'
        type: adoption
  type: resolution
- identifier:
  - prefix: CIML
    number: 1997/9.3
  doi: 10.63493/resolutions/ciml19979.3
  urn: urn:oiml:doc:ciml:resolution:1997-9.3
  dates:
  - date: '1997-10-29'
    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: World Trade Organization
    actions:
    - type: remarks
      message: 'Mr. Athané gave a summary of his preliminary discussions with representatives
        of the WTO, with a view to establishing official contacts between the two
        organizations. He mentioned the cooperation with the former GATT, which had
        led to recognition of the fact that OIML International Recommendations could
        be considered as international standards in the framework of the GATT Code
        of Standards. An official request aimed at registering the OIML as an observer
        organization of the WTO Technical Barrier to Trade Committee had recently
        been sent to the Chairman of this Committee; the final reply had not yet been
        received. Mr. Athané pointed out that a matter of great interest for the WTO
        was the fact that no conflict should exist between the various international
        standards; therefore, OIML should pay attention to eliminating divergences
        between its Recommendations and for example ISO and IEC Standards (it is with
        this in mind that Recommendations R49 on water meters and R46 on electricity
        meters had been withdrawn). In the same way, OIML activities should be transparent
        and should not be developed for the benefit of groups of countries and against
        the interests of other countries.

        '
      date_effective:
        date: '1997-10-29'
        type: adoption
  type: resolution
