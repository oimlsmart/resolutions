    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: Agenda item 18.4
    subject: The Committee
    considerations:
    - type: considering
      message: 'Considering that a number of the OIML''s current activities and technical
        work projects are aimed at better regulation and cooperation in the field
        of climate change in legal metrology activities,

        '
      date_effective:
        date: '2024-10-22'
        type: adoption
    actions:
    - type: requests
      message: 'Requests the BIML to complete the procedures necessary for the OIML
        to become an "accepted observer" in the United Nations Framework Convention
        on Climate Change (UNFCCC),

        '
      date_effective:
        date: '2024-10-22'
        type: adoption
    - type: requests
      message: |
        Requests the BIML to continue to engage with other stakeholders in the field of climate change, and
        Encourages its Members to promote the use of legal metrology as an important tool in climate change mitigation and in the energy transition.
      date_effective:
        date: '2024-10-22'
        type: adoption
  type: resolution
