    script: Latn
    title: PROCHAINES RÉUNIONS
    subject: "(Le CIML)"
    actions:
    - type: remarks
      message: 'La Délégation du Brésil confirme l''invitation au Comité de se réunir
        à Rio en octobre 1997 dans la semaine du 27 au 31. En plus de la réunion du
        CIML, le Brésil a l''intention d''organiser une réunion du SIM (Sistema Interamericano
        de Metrologia), un séminaire et une réunion du Conseil de Développement de
        l''OIML. Le lieu de ces réunions sera l''hôtel Méridien à Copacabana.

        '
      date_effective:
        date: '1996-11-04'
        type: adoption
  type: resolution
