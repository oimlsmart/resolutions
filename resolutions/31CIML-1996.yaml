    title: CLOTURE
    subject: "(Le CIML)"
    actions:
    - type: remarks
      message: 'M. Faber exprime ses remerciements à tous les participants, aux interprètes
        et au Bureau pour la part qu''ils ont prise dans le succès de la réunion,
        et plus spécialement aux hôtes Canadiens pour la remarquable organisation
        de la réunion. Il indique sa satisfaction pour les résultats des discussions
        et remercie les deux Vice-Présidents, MM. Chappell et Kochsiek, pour leur
        aide dans la préparation de la réunion. Il déclare alors la clôture de la
        réunion et convie les membre du CIML à se réunir dans un an au Brésil.

        '
      date_effective:
        date: '1996-11-04'
        type: adoption
  type: resolution
