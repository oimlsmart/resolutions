  - language_code: fra
    script: Latn
    title: Indexation des salaires sur l'inflation
    subject: le Comité
    actions:
    - type: remarks
      message: 'M. Athané rappelle aux participants que, en 1995, le Comité avait
        accepté que l''indice français de l''INSEE représentatif du coût de la vie
        en France soit utilisé pour l''indexation des salaires sur le taux d''inflation
        étant donné que l''OCDE ne fournissait plus gratuitement son propre indice
        aux institutions internationales ayant leur siège en France. M. Athané ajoute
        que cette décision est temporaire puisque le Comité lui a demandé d''examiner
        d''autres possibilités à la lumière de ce qui avait été décidé au sein d''autres
        institutions internationales.

        '
      date_effective:
        date: '1996-11-04'
        type: adoption
  type: resolution
