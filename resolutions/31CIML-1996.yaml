    title: Nomination d'un Adjoint au Directeur
    subject: le Comité
    actions:
    - type: remarks
      message: 'M. Faber rappelle aux participants qu''il a établi un groupe de travail
        comprenant les membres du Conseil de Présidence plus les Membres du CIML qui
        ont présenté des candidats, afin d''établibr une liste raccourcie de candidats
        parmi lesquels le Comité va choisir le future Adjoint au Directeur qui remplacera
        M. Vichenkov en décembre 1997.

        '
