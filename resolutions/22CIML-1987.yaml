    title: Planning exercise for the period 1985 to 1988
    subject: the Committee
    actions:
    - type: remarks
      message: 'M. PETIK drew the attention of the Committee to the final drafts of
        the programmes of work that the Bureau had presented, in a uniform format,
        based on the draft work programmes drawn up by the Secretariats in 1985 and
        approved by the Committee in 1986. Although it was not then possible to draw
        any final conclusions it could be said that, of 150 Reporting Secretariats,
        40 were inactive (their work being either finished or not yet started). Of
        the 110 active Secretariats, three quarters were proceeding according to plan
        and a quarter had slipped behind. There would be a more detailed analysis
        at the beginning of 1988, using the annual reports that the Bureau would receive
        before the end of 1987.

        '
      date_effective:
        date: '1987-09-02'
        type: adoption
  type: resolution
