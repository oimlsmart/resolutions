        de mesure électroniques\n| Nouveau projet: Document | Logiciels-Méthodes et
        moyens de vérification\n| Révision des exigences de la R 138 sur les bouteilles
        récipients-mesures par le TC 6 | \n| Révision de la R 49:2006 | Compteurs
        d'eau pour le mesure de l'eau froide potable et de l'eau chaude\n| Révision
        de la R 18:1989 | Pyromètres optiques à filament disparaissant\n| Révision
        de la R 60:2000 | Réglementation métrologique des cellules de pesée\n| Révision
        de la R 16-1:2002 | Sphygmomanomètres non invasifs mécaniques\n|===\nLe Comité
        a annulé le projet suivant:\nTC 9/SC 4 p1: Valeurs de la densité des solutions
        aqueuses de sucrose\n"
      date_effective:
        date: '2008-10-28'
        type: adoption
  type: resolution
