    subject: CIML
    actions:
    - type: remarks
      message: 'M. Bennett, Président du séminaire rapporte que 153 participants se
        sont réunis à cette occasion, dont la moitié de représentants des services
        de métrologie légale et l''autre de représentants de fabricants. Vingt-six
        conférences ont été présentées, couvrant un large éventail de sujets relatifs
        au pesage, de ceux à caractère informatif jusqu''à ceux destinés à interpeller
        les auditeurs, et ont généré une foison de discussions. M. Bennett conclut
        en faisant remarquer que le séminaire avait été financièrement equilibré de
        par la perception des droits demandés aux représentants des fabricants.

        '
      date_effective:
        date: '1995-10-25'
        type: adoption
  type: resolution
