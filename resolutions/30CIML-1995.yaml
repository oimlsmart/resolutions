    script: Latn
    title: LIAISONS AVEC D'AUTRES ORGANISATIONS AUX NIVEAUX INTERNATIONAL ET RÉGIONAL
    subject: CIML
    actions:
    - type: remarks
      message: 'M. Athané indique que la seule information dont il dispose se rapporte
        à ISO/TAG 4 qui se réunira bientôt à Genève. La création d''un nouveau forum,
        indépendant de l''ISO, est censée permettre aux sept institutions internationales
        déjà membres du TAG 4 (ainsi qu''aux autres institutions éventuellement intéressées)
        de poursuivre leur coopération sans interférer avec la coordination des activités
        métrologiques internes à l''ISO. L''ISO pourrait accepter la responsabilité
        du secrétariat de ce nouveau forum; sinon, un secrétariat commun BIPM/BIML
        pourrait être envisagé.

        '
      date_effective:
        date: '1995-10-25'
        type: adoption
