    type: adoption
  localizations:
  - language_code: fra
    script: Latn
    title: Dispositifs électroniques.
    actions:
    - type: remarks
      message: 'Bien que certains participants aient soutenu l''avis contraire, l''ensemble
        de l''assemblée ne semble pas considérer comme souhaitable la création d''un
        secrétariat traitant spécifiquement des dispositifs électroniques. Chaque
        secrétariat traitant d''une catégorie d''instrument devra s''intéresser aux
        dispositifs électroniques pouvant être associés à l''instrument.

        '
      date_effective:
        date: '1976-10-05'
        type: adoption
  type: resolution
