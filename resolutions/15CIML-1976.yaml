  - language_code: fra
    script: Latn
    title: Situation de la République Dominicaine.
    subject: le Comité
    actions:
    - type: remarks
      message: 'Ayant reçu en 1972 délégation de la Conférence pour statuer sur la
        position de cet État qui, depuis de nombreuses années, a rompu tout lien avec
        l''Organisation, le Comité décide, après avoir pris connaissance des informations
        données par le Bureau à ce sujet et en application de l''Article XXIX de la
        Convention créant l''OIML, de considérer la République Dominicaine comme démissionnaire
        d''office.

        '
      date_effective:
        date: '1976-10-05'
        type: adoption
  type: resolution
