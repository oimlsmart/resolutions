    type: adoption
  localizations:
  - language_code: fra
    script: Latn
    title: État d'avancement de certains travaux.
    subject: le Comité
    actions:
    - type: remarks
      message: 'Le Document « État d''avancement des travaux » distribué aux participants
        montre que certaines études n''ont pas progressé depuis plusieurs années.
        Un effort devra être accompli pour les faire aboutir le plus rapidement possible,
        à moins que le Comité ne décide de les arrêter en raison de leur manque d''intérêt
        sur le plan international.

        '
      date_effective:
        date: '1976-10-05'
        type: adoption
  type: resolution
- identifier:
