    - spelling: eng
      value: |-
        Notes the information given on the election of a President to be held in 2022, and
        Reminds CIML Members that candidacies must be sent to the Bureau by the end of May 2022 at the latest.
  - type: notes
    date_effective:
      date: '2021-10-22'
      type: effective
    message:
    - spelling: fra
      value: |-
        Prend note des informations fournies sur l'élection d'un Président qui aura lieu en 2022, et
