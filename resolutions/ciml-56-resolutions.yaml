  agenda_item: '4.4'
  dates:
  - date: '2021-10-18'
    type: decided
  title:
  - spelling: eng
    value: Report by the CIML President
  - spelling: fra
    value: Report by the CIML President
  subject:
  - spelling: eng
    value: OIML Conference
  - spelling: fra
    value: Conférence OIML
