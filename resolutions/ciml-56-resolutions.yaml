- identifier:
  - prefix: CIML
    number: 2021/04
  doi: 10.63493/resolutions/ciml202104
  urn: urn:oiml:doc:ciml:resolution:2021-04
  agenda_item: '4.2'
  dates:
  - date: '2021-10-18'
    type: decided
  title:
  - spelling: eng
    value: Report by the CIML President
  - spelling: fra
    value: Report by the CIML President
  considerations:
  - type: recalling
    date_effective:
      date: '2021-10-18'
      type: effective
    message:
    - spelling: eng
      value: Recalling its resolution 2020/1,
  - type: noting
    date_effective:
      date: '2021-10-18'
      type: effective
    message:
    - spelling: eng
      value: Noting that all OIML meetings can be held with in-person participation,
        or with solely online participation, or with a combination of in-person and
        online participation,
  - type: recalling
    date_effective:
      date: '2021-10-22'
      type: effective
    message:
    - spelling: fra
      value: Rappelant sa Résolution 2020/1,
  - type: noting
    date_effective:
      date: '2021-10-22'
      type: effective
    message:
    - spelling: fra
      value: Notant que toutes les réunions de l'OIML peuvent se tenir avec une participation
        en personne, ou avec une participation uniquement en ligne, ou avec une combinaison
        de participation en personne et en ligne,
  actions:
  - type: decides
    date_effective:
      date: '2021-10-18'
      type: effective
    message:
    - spelling: eng
      value: Decides that in-person and online participation in all OIML meetings
        is considered to be equivalent, and
  - type: requests
    date_effective:
      date: '2021-10-18'
      type: effective
    message:
    - spelling: eng
      value: Requests the 16th Conference to endorse this policy.
  - type: decides
    date_effective:
      date: '2021-10-22'
      type: effective
    message:
    - spelling: fra
      value: Décide que la participation en personne et en ligne à toutes les réunions
        de l'OIML est considérée comme équivalente, et
  - type: requests
    date_effective:
      date: '2021-10-22'
      type: effective
    message:
    - spelling: fra
      value: Demande à la 16ème Conférence d'approuver cette politique.
