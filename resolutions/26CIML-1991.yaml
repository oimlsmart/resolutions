  - language_code: eng
    script: Latn
    title: DEVELOPING COUNTRIES
    subject: CIML
    actions:
    - type: remarks
      message: 'Mr THULIN indicated that in 1991 this activity had been limited to
        the organization, in close cooperation with Germany (PTB and DAM), of a training
        course on the verification of certain weighing instruments. (It had not proved
        possible to organize a similar course that had been envisaged for France).
        The course had been of particular interest to the developing countries, though
        trainees from other countries had also been invited under the aegis of cooperative
        agreements with Germany. The total number of course members was twenty. OIML,
        for its part, had covered the travel costs (from the Development Council''s
        budget, as agreed in 1990) of four trainees from developing countries that
        were members of OIML. The success of the course had been such that the German
        authorities had decided to repeat it in June and July 1992, and CIML was asked
        whether it would allow the Bureau to participate in this second presentation
        and cover the travelling expenses of two trainees. Mr THULIN added that it
        would no doubt be necessary later, perhaps in 1993, to call a meeting of the
        OIML Development Council to reconsider OIML policy in that field. Mr THULIN
        also gave some information about the booklets produced by the Bureau, mainly
        for the developing countries.

        '
      date_effective:
        date: '1991-10-07'
        type: adoption
  type: resolution
- identifier:
  - prefix: CIML
    number: 1991/10
  doi: 10.63493/resolutions/ciml199110
