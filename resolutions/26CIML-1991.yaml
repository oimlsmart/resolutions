    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: OIML SEMINARS
    subject: CIML
    actions:
    - type: remarks
      message: 'Mr THULIN reported on the preparations for the organization of a technical
        seminar on instruments for measurement of air pollution, proposed by Switzerland,
        which would take place in Interlaken in September 1992. Papers would focus
        on the verification of instruments (in particular those used for vehicle exhausts,
        already the subject of an OIML Recommendation), but other subjects could also
        be addressed and institutions such as ISO (TC 146) would be invited. Details
        would be given later, in or about November, but Mr THULIN wished to bring
        this seminar to the attention of those present straight away so that offers
        of papers could be sent to the Bureau without delay.

        '
      date_effective:
        date: '1991-10-07'
        type: adoption
  type: resolution
