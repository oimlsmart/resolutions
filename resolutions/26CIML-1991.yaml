    title: New structures to be established in application of the procedures
    subject: CIML
    actions:
    - type: remarks
      message: 'Mr BIRKELAND introduced the Bureau''s preliminary proposal for the
        new structures to be established in application of the future procedures,
        since it appeared that CIML was in agreement in principle with the procedures
        discussed under item 6.1. The Bureau''s proposal consisted of a list of projects
        that could lead to the drafting of new Recommendations or to the revision
        of existing Recommendations.

        '
      date_effective:
